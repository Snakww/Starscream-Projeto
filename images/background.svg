<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="glow" cx="68%" cy="46%" r="65%">
      <stop offset="0%" stop-color="#3a0f10" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#200708" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#08070a" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0708"/>
      <stop offset="55%" stop-color="#120a0c"/>
      <stop offset="100%" stop-color="#08070a"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ff3b3b" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#08070a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#08070a" stop-opacity="0.85"/>
    </linearGradient>
    <radialGradient id="softglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff4d4d" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff4d4d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- base -->
  <rect width="1920" height="1080" fill="url(#base)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>

  <!-- soft light blooms -->
  <circle cx="1360" cy="460" r="420" fill="url(#softglow)"/>
  <circle cx="1620" cy="760" r="260" fill="url(#softglow)" opacity="0.6"/>

  <!-- abstract angular aircraft-inspired linework, very stylized/generic -->
  <g stroke="#ff5a5a" stroke-opacity="0.28" stroke-width="2" fill="none">
    <path d="M 1180 520 L 1500 470 L 1780 500 L 1560 545 L 1780 600 L 1480 590 L 1180 640 L 1360 555 Z"/>
    <path d="M 1500 470 L 1560 545 L 1480 590"/>
    <line x1="1180" y1="520" x2="1780" y2="500" stroke-opacity="0.12"/>
  </g>
  <g stroke="#ff8080" stroke-opacity="0.15" stroke-width="1" fill="none">
    <path d="M 1250 610 L 1700 660 L 1620 700 L 1250 660 Z"/>
  </g>

  <!-- circuit accent lines -->
  <g stroke="#ff3b3b" stroke-opacity="0.18" stroke-width="1.5" fill="none">
    <path d="M 80 900 L 380 900 L 420 940 L 700 940"/>
    <path d="M 1900 200 L 1650 200 L 1610 240 L 1300 240"/>
    <circle cx="700" cy="940" r="4" fill="#ff3b3b" fill-opacity="0.4"/>
    <circle cx="1300" cy="240" r="4" fill="#ff3b3b" fill-opacity="0.4"/>
    <circle cx="80" cy="900" r="3" fill="#ff3b3b" fill-opacity="0.3"/>
  </g>

  <!-- vignette -->
  <rect width="1920" height="1080" fill="url(#fade)"/>
  <rect width="1920" height="1080" fill="#08070a" fill-opacity="0.15"/>
</svg>
