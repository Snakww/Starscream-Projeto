<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 220" width="1920" height="220" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="base" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a0708"/>
      <stop offset="50%" stop-color="#130a0c"/>
      <stop offset="100%" stop-color="#0a0708"/>
    </linearGradient>
    <radialGradient id="glowLeft" cx="8%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#3a0f10" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3a0f10" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="92%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#3a0f10" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#3a0f10" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ff3b3b" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <linearGradient id="bottomLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3b3b" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff3b3b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff3b3b" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="220" fill="url(#base)"/>
  <rect width="1920" height="220" fill="url(#grid)"/>
  <rect width="1920" height="220" fill="url(#glowLeft)"/>
  <rect width="1920" height="220" fill="url(#glowRight)"/>

  <!-- linhas de circuito discretas -->
  <g stroke="#ff3b3b" stroke-opacity="0.14" stroke-width="1.2" fill="none">
    <path d="M 700 40 L 900 40 L 930 70 L 1200 70"/>
    <path d="M 1920 160 L 1650 160 L 1620 190 L 1400 190"/>
    <circle cx="930" cy="70" r="3" fill="#ff3b3b" fill-opacity="0.35"/>
    <circle cx="1620" cy="190" r="3" fill="#ff3b3b" fill-opacity="0.3"/>
  </g>

  <!-- linha de brilho no rodapé do header, separando do conteúdo -->
  <rect x="0" y="216" width="1920" height="2" fill="url(#bottomLine)"/>
  <rect x="0" y="0" width="1920" height="1" fill="#ff3b3b" fill-opacity="0.12"/>
</svg>
